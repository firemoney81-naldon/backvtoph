                case "태아보험어린이보험":

                case "유아보험":

                case "산모보험":

                case "아기치아보험":

        // --- Random Selection and Sorting Logic ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generatePageContent() {
            const selectedLinks = [];
            let selectedCount = 0;

            // Step 1: Random selection of links (between 10 and 20) based on categories
            const categoryKeys = Object.keys(categoryGroups);
            shuffleArray(categoryKeys); // Randomize category order

            for (const key of categoryKeys) {
                const categoryLinks = categoryGroups[key].map(id => allLinksData.find(link => link.id === id));
                shuffleArray(categoryLinks); // Randomize links within category
                // For demonstration purposes, let's keep a consistent number of links per category,
                // but the final selection will be between 10-20.
                // Here, I'll select all links (20 total) and then randomly remove some if needed, but for a solid example,
                // I will include all 20 links based on the user's request for 10-20 links and detailed descriptions.
                selectedLinks.push({ category: key, links: categoryLinks });
            }

            // Step 2: Render the content
            const contentArea = document.getElementById('content-area');
            let htmlContent = '';

            selectedLinks.forEach((categoryData, index) => {
                const categoryTitle = categoryData.category;
                const links = categoryData.links;

                htmlContent += `<section class="category-${index + 1}">`;
                htmlContent += `<h2>${categoryTitle}</h2>`;
                htmlContent += `<div class="grid-layout">`;

                links.forEach(link => {
                    // Generate description for the link
                    const detailedDescription = generateDetailedDescription(link.keyword);

                    htmlContent += `
                        <article class="grid-item">
                            <div class="link-card">
                                <h3><a href="${link.url}" target="_blank">${link.keyword}</a></h3>
                                <a href="${link.url}" target="_blank">
                                    <p>${detailedDescription}</p>
                                </a>
                            </div>
                        </article>
                    `;
                });

                htmlContent += `</div></section>`;
            });

            contentArea.innerHTML = htmlContent;
        }

        // Run content generation on load
        document.addEventListener('DOMContentLoaded', generatePageContent);
    </script>

  <div style="color: #ccc;">
    <span id="bot-msg">데이터 동기화 중...</span> | 
    <!-- [네이버 팁] 빈 태그(empty tag)는 로봇이 무시하므로 기본 날짜형식을 넣어둡니다 -->
    최종 기준일: <time id="bot-date" datetime="2026-01-01">2026-01-01</time>
  </div>
</footer>
<script>
  (function() {
    // 1. 한국 시간(KST) 강제 계산 (네이버는 한국 시간이 기준)
    const now = new Date();
    const utc = now.getTime() + (now.getTimezoneOffset() * 60 * 1000);
    const kstGap = 9 * 60 * 60 * 1000;
    const today = new Date(utc + kstGap);

    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    
    // YYYY-MM-DD 형식
    const formattedDate = `${year}-${month}-${day}`;
    // ISO 8601 형식 (검색엔진이 가장 좋아하는 표준 포맷)
    const isoDate = `${formattedDate}T09:00:00+09:00`;

    // 2. 사용자 화면 업데이트 (보여주기용)
    const siteTitleElem = document.getElementById('site-title');
    if (siteTitleElem) siteTitleElem.textContent = document.title || window.location.hostname;

    const yearElem = document.getElementById('copyright-year');
    if (yearElem) yearElem.textContent = year;

    const dateElem = document.getElementById('bot-date');
    if(dateElem) {
      dateElem.textContent = formattedDate;
      dateElem.setAttribute('datetime', formattedDate);
    }

    const msgElem = document.getElementById('bot-msg');
    if(msgElem) {
      // 네이버 봇이나 사용자가 볼 때 신뢰감을 주는 문구
      const msgs = ["서비스 최적화 완료", "보안 점검 완료", "데이터 최신화"];
      msgElem.textContent = msgs[today.getDate() % msgs.length];
    }

    // 3. [핵심] 네이버 봇 타겟 메타 태그 주입
    // 네이버가 수집 시 '최신 콘텐츠'인지 판단할 때 참고하는 태그들입니다.
    
    function setMetaTag(attrType, attrName, content) {
      // 이미 존재하는 태그인지 확인 (property="og:..." 또는 name="date" 등)
      let selector = `meta[${attrType}="${attrName}"]`;
      let meta = document.querySelector(selector);
      
      // 없으면 새로 만들어서 head에 추가
      if (!meta) {
        meta = document.createElement('meta');
        meta.setAttribute(attrType, attrName);
        document.head.appendChild(meta);
      }
      // 있으면 내용만 최신 날짜로 교체
      meta.content = content;
    }

    // (A) 네이버가 1순위로 보는 Open Graph 수정일 (블로그/카페/웹문서 공통)
    setMetaTag('property', 'og:updated_time', isoDate);

    // (B) 네이버 웹문서/뉴스 검색 알고리즘이 참고하는 Article 속성
    setMetaTag('property', 'article:modified_time', isoDate);
    
    // (C) 일반 검색엔진(공통) 날짜 태그
    setMetaTag('name', 'date', isoDate);

    // (D) 네이버가 사이트 소유 확인 시 참고하는 저작권 정보 갱신
    setMetaTag('name', 'copyright', `${year} ${document.title}`);

  })();
</script>
